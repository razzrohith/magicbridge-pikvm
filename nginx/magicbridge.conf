# Suppress the nginx version string in Server: headers and error pages. Included
# inside kvmd's server block, so it applies to the whole HTTPS surface. A version
# banner is free pre-auth reconnaissance and, combined with the exact nginx build
# PiKVM ships, helps fingerprint the platform we are trying not to advertise.
server_tokens off;

# MagicBridge — extra nginx location blocks for the add-on services.
# Dropped at /etc/kvmd/nginx/magicbridge.conf and included by kvmd's nginx
# server block. kvmd already terminates TLS on :443; we just add upstreams.
#
# NOTE: kvmd's nginx include path/mechanism is confirmed on-device during
# hardware bring-up. If kvmd uses a different include convention on the
# installed OS build, magic-install.sh adapts in phase5.

# Anonymity: do NOT record who connects. PiKVM already mounts /var/log on tmpfs
# (RAM), so access logs never hit the SD card — but we go further and disable
# access logging entirely for this server, so visitor IPs / User-Agents aren't
# recorded even in RAM. (error_log stays for real faults; it carries no visitor
# IPs.) Mirrors DIY's "no visitor IPs on disk" hardening.
access_log off;

# MagicBridge network toolkit (DuckDNS, lockdown, MAC, WiFi helpers)
# Longer timeouts here: /tailscale/install runs a real package install
# (pacman + optional curl fallback), which can take well over nginx's
# default 60s proxy_read_timeout and would otherwise 504 mid-install.
location /mb/net/ {
    proxy_pass http://127.0.0.1:8410/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

# MagicBridge stealth USB identity panel
location /mb/stealth/ {
    proxy_pass http://127.0.0.1:8411/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
}

# MagicBridge AI agent (disabled by default via feature flag)
location /mb/agent/ {
    proxy_pass http://127.0.0.1:8412/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
}

# TWO MECHANISMS ONLY: the regular cockpit (/mb/ui/) and the stealth panel
# (/stealth/). The cockpit is the sole landing page; kvmd's native view pages are
# redirected here so they are not a separate face (and don't leak PiKVM tells).
# /api /share /streamer /janus /login stay reachable — the cockpit depends on them.
location = / { return 302 /mb/ui/; }
location /kvm/          { return 302 /mb/ui/; }
location = /kvm         { return 302 /mb/ui/; }
location /vnc/          { return 302 /mb/ui/; }
location = /index.html { return 302 /mb/ui/; }

# MagicBridgeV2 web UI (professional cockpit). Served at /mb/ui/.
# The UI uses absolute /api (kvmd) and /mb (our services) paths.
location = /mb/ui { return 301 /mb/ui/; }     # allow the slash-less form
location /mb/ui/ {
    alias /opt/magicbridge/web/;
    index index.html;
    try_files $uri $uri/ /mb/ui/index.html;
    # An expired/absent kvmd session otherwise yields a bare nginx 403 here.
    # Send the user to the branded login page instead of a dead-end error.
    error_page 401 403 = @mb_login;
}
location @mb_login { return 302 /login/; }

# Dedicated Stealth Control panel (USB identity + MAC + EDID), professional theme.
location = /stealth { return 301 /stealth/; }
location /stealth/ {
    alias /opt/magicbridge/web/stealth/;
    index index.html;
    try_files $uri $uri/ /stealth/index.html;
}
