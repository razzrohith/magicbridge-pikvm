# MagicBridge: don't let a networkless boot stall the KVM for two minutes.
#
# WHY (measured on the first flashed unit): kvmd.service is ordered
# `After=network.target network-online.target nss-lookup.target`. Ordering only
# bites if something PULLS network-online.target into the transaction — and our
# own units do exactly that (magicbridge-net/-stealth/-agent and mb-mdns-alias
# each carry `Wants=network-online.target`). Arch ships
# systemd-networkd-wait-online enabled with NO timeout override, i.e. it blocks
# for up to 120s when no interface reaches a routable state.
#
# Net effect on a freshly-flashed unit — which by definition has NO Wi-Fi yet and
# comes up in setup-hotspot mode — kvmd, kvmd-nginx and every MagicBridge sidecar
# sat "inactive" for ~2 minutes of boot. The unit looked hung/bricked exactly when
# a new owner is watching it hardest. Verified in a real boot report: kvmd,
# kvmd-nginx, magicbridge-{net,stealth,agent} all `inactive` at 1 min uptime while
# kvmd-otg and mb-anon-defaults (no network-online ordering) were already active.
#
# --any: satisfied as soon as ONE interface is online (we only ever need one).
# --timeout=15: cap the wait; network-online is best-effort and our services
# already tolerate the network arriving late (they retry), so failing open is
# strictly better than holding the KVM hostage.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=15
